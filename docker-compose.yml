version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: arepIA-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./arepIA.db
      - PYTHONUNBUFFERED=1
    networks:
      - arepIA-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: arepIA-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - arepIA-network

networks:
  arepIA-network:
    driver: bridge
